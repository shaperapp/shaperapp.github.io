<title>Shaper</title>

<style>
/* Layout: app-shell no estilo do print — fundo cinza-claro, cartões brancos bem arredondados, seletor segmentado com item ativo preto, barra inferior com 6 abas e ativo azul. Tema claro único, por escolha. */
:root{
  --bg:#EDEFEC; --card:#FFFFFF; --field:#E6E8E5; --line:#DFE2DE;
  --fg:#121412; --muted:#6A6F6A; --ink:#161917; --ink-fg:#FFFFFF;
  --blue:#2C66E0; --live:#22A559; --rest:#E39A12; --danger:#C93C3C;
  --display:"Archivo","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:22px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:22px calc(104px + env(safe-area-inset-bottom,0px))}
h1,h2,.disp{font-family:var(--display);font-stretch:125%;font-weight:800;letter-spacing:-.01em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:2rem}
h2{font-size:1.25rem}
h3{font-family:var(--body);font-weight:700;font-size:1.2rem;margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sechead h3{font-size:1.3rem}
.sechead span{color:var(--muted)}
.muted{color:var(--muted)}
.note{font-size:.88rem;color:var(--muted);margin:0}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--card);border-radius:var(--r);padding:18px;border:1px solid var(--line)}
.greet{color:var(--muted);font-size:1rem}
.chips{display:flex;gap:12px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 18px;font-size:.98rem;color:var(--muted)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--live)}
.roundbtn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.seg{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button{background:none;border:0;border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-weight:600;font-size:.92rem}
.seg button svg.i{width:26px;height:26px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:20px;padding:16px 8px;text-align:center;border:1px solid var(--line)}
.tile b{display:block;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:1.75rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.86rem;color:var(--muted)}
.shortcuts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shortcut{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 6px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600;font-size:1rem}
.shortcut svg.i{width:28px;height:28px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.95rem;min-width:0}
input[type=number],input[type=time],input[type=date],input[type=url],select{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;color:var(--fg);width:100%;min-width:0}
input:disabled{opacity:.75}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 20px;font-weight:700;font-size:1rem;background:var(--field);color:var(--fg);min-height:52px}
.btn.primary{background:var(--ink);color:var(--ink-fg)}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn.danger{color:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--field);color:var(--muted)}
.pill.ink{background:var(--ink);color:var(--ink-fg)}
.pill.live{background:#DDF3E5;color:#16733C}
/* demo em loop: fotos reais alternando, sem player */
.vid{position:relative;overflow:hidden;background:#1a1a1a;border-radius:18px;aspect-ratio:3/2;max-width:100%;width:100%}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.vid img.b{animation:swap var(--sp,1.6s) steps(1,end) infinite}
@keyframes swap{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.vid.yt iframe{position:absolute;left:50%;top:50%;width:118%;height:118%;transform:translate(-50%,-50%);border:0;pointer-events:none;background:#000}
.vid .shield{position:absolute;inset:0}
.vid .tag{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:99px}
.vid.walk{display:grid;place-items:center;background:var(--ink);color:#fff}
.vid.walk div{text-align:center}
.vid.walk b{display:block;font-family:var(--display);font-stretch:125%;font-size:2.4rem}
.thumb{width:76px;flex:none;border-radius:12px;aspect-ratio:3/2;overflow:hidden;background:#222;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.walk{background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.75rem;font-weight:700}
.ex{display:flex;align-items:center;gap:12px;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.ex:last-child{border-bottom:0}
.ex .t{flex:1;min-width:0}
.ex .t b{display:block;font-weight:700}
.ex .t span{font-size:.86rem;color:var(--muted)}
.ex .rx{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:1.05rem;white-space:nowrap;text-align:right}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 0 9px;text-align:center;font-size:.82rem;font-weight:700;color:var(--muted)}
.day i{display:block;width:7px;height:7px;border-radius:50%;margin:5px auto 0;background:var(--field)}
.day.done i{background:var(--live)}
.day.today{border-color:var(--fg);color:var(--fg)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.grid90{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.grid90 i{aspect-ratio:1;border-radius:4px;background:var(--field);max-width:100%}
.grid90 i.d{background:var(--live)}
.grid90 i.t{outline:2px solid var(--fg);outline-offset:-2px}
.grid90 i.p{background:var(--blue);opacity:.14}
.chart{width:100%;height:auto;display:block}
.list div{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list div:last-child{border-bottom:0}
.macros{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.macro{background:var(--field);border-radius:16px;padding:14px}
.macro b{display:block;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.macro span{font-size:.85rem;color:var(--muted)}
.meal{padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal small{display:block;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:.72rem}
ul.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.switch{position:relative;width:54px;height:32px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--field);border:1px solid var(--line);pointer-events:none;transition:.2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+span{background:var(--live);border-color:var(--live)}
.switch input:checked+span::after{left:25px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow b{display:block}
.bigtime{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(4rem,21vw,6.6rem);line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;font-weight:500;color:var(--muted)}
nav.tabs button svg.i{width:26px;height:26px}
nav.tabs button[aria-current="page"]{color:var(--blue);font-weight:700}
/* folha */
.scrim{position:fixed;inset:0;background:rgba(18,20,18,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:26px 26px 0 0;padding:20px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* player */
.player{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));--stage:var(--blue)}
.player.rest{--stage:var(--rest)}
.pl{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
.pl-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pl-prog{height:6px;background:var(--field);border-radius:99px;overflow:hidden}
.pl-prog i{display:block;height:100%;background:var(--stage);transition:width .3s}
.pl-stage{display:flex;gap:8px;align-items:center}
.pl-stage .pill{background:var(--stage);color:#fff}
.pl-name{font-size:1.7rem}
.pl-rx{color:var(--muted);font-size:1rem}
.pl-time{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.pl-time .bigtime{color:var(--stage)}
.ring{height:10px;background:var(--field);border-radius:99px;overflow:hidden}
.ring i{display:block;height:100%;background:var(--stage)}
.pl-next{font-size:.95rem;color:var(--muted)}
.pl-next b{color:var(--fg)}
.pl-ctrl{display:grid;grid-template-columns:58px 1fr 58px 58px;gap:10px;margin-top:auto}
.sq{width:58px;height:58px;border-radius:18px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.sq:disabled{opacity:.4}
.main{border:0;border-radius:18px;background:var(--ink);color:#fff;font-weight:700;font-size:1.15rem;display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px}
.confirm{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.done-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:90;max-width:90%}
.bar{height:10px;background:var(--field);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.bar.ok i{background:var(--live)}
.qchips{display:flex;flex-wrap:wrap;gap:8px}
.qchip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 12px;font-size:.88rem;font-weight:600}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.badge svg{width:34px;height:34px}
.badge b{font-size:.82rem;line-height:1.2}
.badge span{font-size:.72rem;color:var(--muted);line-height:1.2}
.badge.off{opacity:.38;filter:grayscale(1)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:6px}
.cmp img,.ph-big{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:var(--field);max-width:100%;display:block}
.cmp figcaption{font-size:.82rem;color:var(--muted);text-align:center}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.strip button{flex:none;width:70px;border:0;padding:0;background:none;border-radius:10px;overflow:hidden}
.strip img{width:70px;height:93px;object-fit:cover;display:block}
.segs{display:inline-flex;background:var(--field);border-radius:12px;padding:3px;gap:2px}
.segs button{border:0;background:none;border-radius:10px;padding:6px 14px;font-weight:600;color:var(--muted)}
.segs button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
details.fold summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.05rem}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"+";font-size:1.4rem;color:var(--muted)}
details.fold[open] summary::after{content:"–"}
.shop h4{margin:12px 0 4px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.shop label{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.shop input{width:20px;height:20px;accent-color:var(--live)}
.shop label.got span{text-decoration:line-through;color:var(--muted)}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:360px}
.feel button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 4px;font-weight:700}
.feel button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
textarea{width:100%;min-height:90px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:.8rem;color:var(--fg)}
@media (prefers-reduced-motion: reduce){.vid img.b{animation-duration:3.2s}*{transition:none!important}}
</style>

<script>
"use strict";
const IMG = {"Air_Bike":["img/x1.jpg","img/x2.jpg"],"Alternate_Heel_Touchers":["img/x3.jpg","img/x4.jpg"],"Bent-Knee_Hip_Raise":["img/x5.jpg","img/x6.jpg"],"Bodyweight_Squat":["img/x7.jpg","img/x8.jpg"],"Butt-Ups":["img/x9.jpg","img/x10.jpg"],"Butt_Lift_Bridge":["img/x11.jpg","img/x12.jpg"],"Cocoons":["img/x13.jpg","img/x14.jpg"],"Cross-Body_Crunch":["img/x15.jpg","img/x16.jpg"],"Crunches":["img/x17.jpg","img/x18.jpg"],"Dead_Bug":["img/x19.jpg","img/x20.jpg"],"Elbow_to_Knee":["img/x21.jpg","img/x22.jpg"],"Freehand_Jump_Squat":["img/x23.jpg","img/x24.jpg"],"Jackknife_Sit-Up":["img/x25.jpg","img/x26.jpg"],"Knee_Tuck_Jump":["img/x27.jpg","img/x28.jpg"],"Leg_Pull-In":["img/x29.jpg","img/x30.jpg"],"Lower_Back_Curl":["img/x31.jpg","img/x32.jpg"],"Mountain_Climbers":["img/x33.jpg","img/x34.jpg"],"Oblique_Crunches_-_On_The_Floor":["img/x35.jpg","img/x36.jpg"],"Plank":["img/x37.jpg","img/x38.jpg"],"Pushups":["img/x39.jpg","img/x40.jpg"],"Reverse_Crunch":["img/x41.jpg","img/x42.jpg"],"Russian_Twist":["img/x43.jpg","img/x44.jpg"],"Scissor_Kick":["img/x45.jpg","img/x46.jpg"],"Side_Bridge":["img/x47.jpg","img/x48.jpg"],"Spider_Crawl":["img/x49.jpg","img/x50.jpg"],"Standing_Lateral_Stretch":["img/x51.jpg","img/x52.jpg"],"Star_Jump":["img/x53.jpg","img/x54.jpg"],"Stomach_Vacuum":["img/x55.jpg","img/x56.jpg"],"Superman":["img/x57.jpg","img/x58.jpg"],"Toe_Touchers":["img/x59.jpg","img/x60.jpg"],"Tuck_Crunch":["img/x61.jpg","img/x62.jpg"]};

/* ================= Exercícios (fotos: Free Exercise DB, domínio público) ================= */
const EX = {
  Crunches:{n:"Abdominal supra",m:"Abdômen superior",how:["Deitado, joelhos dobrados e pés no chão.","Mãos ao lado da cabeça, sem puxar o pescoço.","Suba tirando as escápulas do chão e desça devagar."],tip:"Solte o ar ao subir e não deixe o abdômen relaxar na descida."},
  Tuck_Crunch:{n:"Abdominal grupado",m:"Abdômen superior e inferior",how:["Deitado, joelhos dobrados em direção ao peito.","Suba o tronco ao mesmo tempo em que aproxima os joelhos.","Volte controlando."],tip:"Movimento curto e forte, sem embalo."},
  Toe_Touchers:{n:"Toque nos pés",m:"Abdômen superior",how:["Deitado, pernas estendidas para o teto.","Suba o tronco tentando tocar a ponta dos pés.","Desça devagar sem encostar a cabeça."],tip:"Se puxar a lombar, dobre um pouco os joelhos."},
  Reverse_Crunch:{n:"Abdominal infra",m:"Abdômen inferior",how:["Deitado, mãos ao lado do corpo e joelhos dobrados.","Puxe os joelhos em direção ao peito tirando o quadril do chão.","Desça devagar até quase encostar os pés."],tip:"Quem sobe é o quadril; não use embalo das pernas."},
  "Bent-Knee_Hip_Raise":{n:"Elevação de quadril",m:"Abdômen inferior",how:["Deitado, joelhos dobrados acima do quadril.","Eleve o quadril alguns centímetros do chão contraindo o abdômen.","Desça devagar."],tip:"Pequeno e controlado vale mais que grande e rápido."},
  Scissor_Kick:{n:"Tesoura",m:"Abdômen inferior",how:["Deitado, mãos sob o quadril, pernas estendidas.","Eleve as pernas e cruze uma sobre a outra alternando.","Mantenha a lombar colada no chão."],tip:"Quanto mais baixas as pernas, mais difícil."},
  "Leg_Pull-In":{n:"Encolhimento de pernas",m:"Abdômen inferior",how:["Sentado ou deitado, apoiado nos cotovelos.","Puxe os joelhos ao peito.","Estenda as pernas sem tocar o chão e repita."],tip:"Mantenha o tronco firme durante todo o movimento."},
  Air_Bike:{n:"Abdominal bicicleta",m:"Oblíquos e reto abdominal",how:["Deitado, mãos atrás da cabeça e ombros fora do chão.","Leve o cotovelo ao joelho oposto enquanto estende a outra perna.","Alterne os lados em ritmo constante."],tip:"Gire o tronco, não só o cotovelo."},
  Russian_Twist:{n:"Giro russo",m:"Oblíquos",how:["Sentado, tronco inclinado para trás, joelhos dobrados.","Gire o tronco levando as mãos ao lado do quadril.","Alterne os lados."],tip:"Para dificultar, tire os pés do chão."},
  "Oblique_Crunches_-_On_The_Floor":{n:"Abdominal oblíquo",m:"Oblíquos",side:1,how:["Deitado de lado, joelhos dobrados.","Mão atrás da cabeça, suba o tronco de lado.","Na metade do tempo, troque de lado."],tip:"Sinta a lateral da cintura trabalhando."},

let IT={work:40,rest:20,rounds:8,run:false,phase:"w",left:40,round:1,last:0,lastSec:null};
function itLabel(){return IT.phase==="w"?"Exercício · volta "+IT.round+" de "+IT.rounds:IT.phase==="r"?"Descanso · volta "+IT.round+" de "+IT.rounds:"Concluído"}
function fmtT(s){s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60);return String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function vTimer(){
  const tot=IT.phase==="w"?IT.work:IT.phase==="r"?IT.rest:1,pct=IT.phase==="d"?100:(1-IT.left/tot)*100;
  return '<div class="stack"><div><div class="greet">Cronômetro com voz</div><h1>Timer</h1></div>'+
  '<div class="card stack" style="gap:14px;text-align:center"><div class="muted" id="itLab">'+itLabel()+'</div><div class="bigtime" id="itTime" style="color:'+(IT.phase==="r"?"var(--rest)":"var(--fg)")+'">'+fmtT(IT.left)+'</div>'+
  '<div class="ring" style="--stage:'+(IT.phase==="r"?"var(--rest)":"var(--blue)")+'"><i id="itBar" style="width:'+pct.toFixed(1)+'%"></i></div>'+
  '<div class="row"><button class="btn primary" style="flex:1" id="itGo">'+(IT.run?IC.pause+" Pausar":IC.play+" Iniciar")+'</button><button class="btn ghost" id="itReset">'+IC.reset+' Reiniciar</button></div></div>'+
  '<div class="card stack" style="gap:12px"><h3>Configurar</h3><div class="fields" style="grid-template-columns:1fr 1fr 1fr">'+
  '<label class="f">Exercício (s)<input id="itW" type="number" min="5" max="900" value="'+IT.work+'"></label><label class="f">Descanso (s)<input id="itR" type="number" min="0" max="900" value="'+IT.rest+'"></label><label class="f">Voltas<input id="itN" type="number" min="1" max="50" value="'+IT.rounds+'"></label></div>'+
  '<p class="note">A voz avisa o tempo restante, conta 3, 2, 1 e toca um alarme quando cada etapa termina.</p></div></div>';
}
function itSync(){const t=$("#itTime");if(!t)return;t.textContent=fmtT(IT.left);t.style.color=IT.phase==="r"?"var(--rest)":"var(--fg)";$("#itLab").textContent=itLabel();
  const tot=IT.phase==="w"?IT.work:IT.phase==="r"?IT.rest:1;const b=$("#itBar");b.style.width=(IT.phase==="d"?100:(1-IT.left/tot)*100).toFixed(1)+"%";b.parentNode.style.setProperty("--stage",IT.phase==="r"?"var(--rest)":"var(--blue)");
  $("#itGo").innerHTML=IT.run?IC.pause+" Pausar":IC.play+(IT.phase==="d"?" Recomeçar":" Iniciar")}
function itTick(){if(!IT.run)return;const now=performance.now();let dt=(now-IT.last)/1000;IT.last=now;IT.left-=dt;
  const sec=Math.ceil(IT.left);if(sec!==IT.lastSec){IT.lastSec=sec;cueCount(sec,IT.phase==="w"?IT.work:IT.rest)}
  if(IT.left<=0){alarm();
    if(IT.phase==="w"&&IT.rest>0){IT.phase="r";IT.left=IT.rest;say("Descanso. "+secTxt(IT.rest))}
    else if(IT.round<IT.rounds){IT.round++;IT.phase="w";IT.left=IT.work;say("Volta "+IT.round+". Vai!")}
    else{IT.phase="d";IT.left=0;IT.run=false;say("Timer concluído. Mandou bem!");keepAwake(false);nat("disarmTimer")}
    if(IT.run)nat("armTimer",Math.round(IT.left*1000),"Tempo esgotado",IT.phase==="r"?"Hora de voltar ao exercício":"Hora do descanso");}
  itSync()}
function itReset(){IT.run=false;IT.phase="w";IT.round=1;IT.left=IT.work;IT.lastSec=null;keepAwake(false);nat("disarmTimer")}
function cueCount(sec,total){if(sec<=0)return;if(sec<=3){beep();say(String(sec))}else if(sec===10&&total>=20)say("Faltam 10 segundos")}

const DB={db:null,open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);try{const r=indexedDB.open("shaper",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id"});r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  tx(mode,fn){return this.open().then(db=>new Promise((res,rej)=>{const t=db.transaction("photos",mode),st=t.objectStore("photos");const out=fn(st);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)}))},
  all(){return this.tx("readonly",st=>st.getAll())},put(o){return this.tx("readwrite",st=>st.put(o))},del(id){return this.tx("readwrite",st=>st.delete(id))},clear(){return this.tx("readwrite",st=>st.clear())}};

  const p=S.profile,w=curW(),dw=w-p.startWeight,ws=curWaist(),w0=firstWaist();

  const hist=S.history.slice().reverse().slice(0,30).map(h=>'<div><span><b>'+h.n+'</b><br><span class="muted">'+fmtD(h.d)+' · Dia '+h.day+(FEEL[h.feel]||"")+'</span></span><b class="disp" style="font-size:1.1rem">'+Math.max(1,Math.round(h.dur/60))+' min</b></div>').join("");
  const logs=S.logs.slice().reverse().slice(0,8).map(l=>'<div><span>'+fmtD(l.d)+'</span><span>'+(l.kg?'<b>'+l.kg.toFixed(1).replace(".",",")+' kg</b>':'')+(l.waist?' <span class="muted">· cintura '+String(l.waist).replace(".",",")+' cm</span>':'')+'</span></div>').join("");
  return '<div class="stack"><div><div class="greet">90 dias</div><h1>Progresso</h1></div>'+
  '<div class="tiles"><div class="tile"><b>'+uniq+'</b><span>dias treinados</span></div><div class="tile"><b>'+streak()+'</b><span>em sequência</span></div><div class="tile"><b>'+(dw<=0?"":"+")+dw.toFixed(1).replace(".",",")+'</b><span>kg desde o início</span></div></div>'+
  '<div class="card stack" style="gap:12px"><div class="row between"><h3>Dia '+c+' de 90</h3><span class="pill">'+fmtD(S.start)+' a '+fmtD(addDays(S.start,89))+'</span></div><div class="grid90">'+cells+'</div></div>'+
  '<div class="sec"><div class="sechead"><h3>Peso e cintura</h3><span>meta '+String(p.goalWeight).replace(".",",")+' kg</span></div><div class="card stack" style="gap:12px">'+chart()+
  '<form id="wform" class="stack" style="gap:10px"><div class="fields"><label class="f">Peso (kg)<input id="wkg" type="number" step="0.1" inputmode="decimal" value="'+w.toFixed(1)+'"></label><label class="f">Cintura (cm)<input id="wcm" type="number" step="0.5" inputmode="decimal" placeholder="no umbigo" value="'+(ws||"")+'"></label></div><button class="btn primary block" type="submit">Registrar hoje</button></form>'+
  (ws&&w0&&ws!==w0?'<p class="note">Cintura: '+(ws-w0>0?"+":"")+(ws-w0).toFixed(1).replace(".",",")+' cm desde a primeira medida.</p>':'<p class="note">Meça a cintura na altura do umbigo, relaxado, 1 vez por semana.</p>')+
  '<div class="list">'+logs+'</div></div></div>'+
  photosHTML()+badgesHTML()+
  '<div class="sec"><div class="sechead"><h3>Histórico</h3><span>'+S.history.length+' treinos</span></div><div class="card list" style="padding-block:6px">'+(hist||'<p class="note" style="padding:10px 0">Nenhum treino concluído ainda. Ao terminar um treino ele aparece aqui.</p>')+'</div></div></div>';
}
function chart(){
  const W=320,H=150,pl=30,pr=12,pt=12,pb=22,p=S.profile;
  const pts=S.logs.filter(l=>l.kg).map(l=>({x:Math.min(Math.max(diffDays(S.start,l.d),0),90),y:l.kg}));
  const ys=pts.map(q=>q.y).concat([p.startWeight,p.goalWeight]);const lo=Math.floor(Math.min.apply(null,ys)-1),hi=Math.ceil(Math.max.apply(null,ys)+1);
  const X=x=>pl+x/90*(W-pl-pr),Y=y=>pt+(hi-y)/(hi-lo)*(H-pt-pb);let g="";
  const step=Math.max(1,Math.ceil((hi-lo)/4));for(let v=lo;v<=hi;v+=step)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="#DFE2DE"/><text x="'+(pl-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="#6A6F6A">'+v+'</text>';
  [0,30,60,90].forEach(d=>g+='<text x="'+X(d).toFixed(1)+'" y="'+(H-5)+'" text-anchor="'+(d===0?"start":d===90?"end":"middle")+'" font-size="10" fill="#6A6F6A">dia '+d+'</text>');
  g+='<line x1="'+X(0)+'" y1="'+Y(p.startWeight).toFixed(1)+'" x2="'+X(90)+'" y2="'+Y(p.goalWeight).toFixed(1)+'" stroke="#E39A12" stroke-width="1.5" stroke-dasharray="4 4"/><text x="'+(X(90)-2)+'" y="'+(Y(p.goalWeight)-6).toFixed(1)+'" text-anchor="end" font-size="10" fill="#B87A06">meta</text>';
  const path=pts.map((q,i)=>(i?"L":"M")+X(q.x).toFixed(1)+" "+Y(q.y).toFixed(1)).join(" ");
  if(pts.length>1)g+='<path d="'+path+' L'+X(pts[pts.length-1].x).toFixed(1)+' '+(H-pb)+' L'+X(pts[0].x).toFixed(1)+' '+(H-pb)+'Z" fill="#2C66E0" opacity=".1"/>';
  g+='<path d="'+path+'" fill="none" stroke="#2C66E0" stroke-width="2.5" stroke-linejoin="round"/>';const l=pts[pts.length-1];
  g+='<circle cx="'+X(l.x).toFixed(1)+'" cy="'+Y(l.y).toFixed(1)+'" r="4.5" fill="#2C66E0"/>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de peso">'+g+'</svg>';
}

/* ================= Dieta ================= */
function targets(){const p=S.profile,w=curW();const bmr=10*w+6.25*p.height-5*p.age+(p.sex==="f"?-161:5),tdee=bmr*1.55;const kcal=Math.round((tdee-500)/50)*50;
  const prot=Math.round(w*2.1),fat=Math.round(w*.75),carb=Math.max(80,Math.round((kcal-prot*4-fat*9)/4));return{tdee:Math.round(tdee),kcal,prot,fat,carb,water:(w*.04).toFixed(1).replace(".",",")}}
const PFOOD=[["3 ovos",18],["Frango 150 g",46],["Carne magra 150 g",39],["Peixe 150 g",33],["Whey 1 dose",24],["Iogurte natural",10],["Feijão 1 concha",7],["Queijo branco 2 fatias",9],["Atum 1 lata",25]];
const SHOP=[["Proteínas",["Ovos · 2 dúzias","Peito de frango · 1,2 kg","Patinho ou carne magra · 600 g","Peixe (tilápia) · 500 g","Atum em lata · 2 latas","Iogurte natural · 6 potes","Queijo branco · 300 g","Whey (opcional)"]],
  ["Carboidratos",["Arroz · 1 kg","Feijão · 500 g","Lentilha · 500 g","Batata-doce · 1 kg","Aveia · 500 g","Pão integral · 1 pacote","Goma de tapioca · 500 g","Flocão de milho · 500 g"]],
  ["Frutas e verduras",["Banana · 1 dúzia","Maçã ou mamão","Morango · 1 caixa","Folhas (alface, rúcula)","Tomate","Cenoura","Brócolis","Abóbora","Cebola e alho"]],
  ["Outros",["Castanhas · 200 g","Pasta de amendoim","Azeite","Café","Temperos naturais"]]];
function dayCounter(k){const t=todayStr();if(!S[k]||S[k].d!==t)S[k]={d:t,v:0,h:[]};return S[k]}
// primeiro nome de quem treina (conta ou formulário de boas-vindas)
function esc0(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function myName(){const a=S.acct||{},n=(a.name&&a.name!=="Jogador")?a.name:(S.plan&&S.plan.nick)||"";return (n.trim().split(/\s+/)[0]||"Atleta").slice(0,16)}
function waterGoal(){return S.plan&&S.plan.water>0?S.plan.water:Math.round(curW()*40/250)*250}
function vDieta(){const T=targets(),c=dayC();const PR=dayCounter("prot"),WA=dayCounter("water"),wTarget=waterGoal();
  const pct=Math.min(100,PR.v/T.prot*100),wpct=Math.min(100,WA.v/wTarget*100);
  const trackers='<div class="sec"><div class="sechead"><h3>Hoje</h3><span>'+fmtD(todayStr())+'</span></div><div class="card stack" style="gap:12px">'+
   '<div class="row between"><b>Proteína</b><span><b class="disp">'+PR.v+'</b> / '+T.prot+' g</span></div><div class="bar'+(PR.v>=T.prot?" ok":"")+'"><i style="width:'+pct.toFixed(1)+'%"></i></div>'+
   '<div class="qchips">'+PFOOD.map(([n,g])=>'<button class="qchip" data-prot="'+g+'">'+n+' <span class="muted">+'+g+' g</span></button>').join("")+(PR.h.length?'<button class="qchip" data-prot="undo">Desfazer</button>':'')+'</div>'+
   (PR.v>=T.prot?'<p class="note" style="color:#16733C">Meta de proteína batida hoje.</p>':'')+
   '<div class="row between" style="margin-top:6px"><b>Água</b><span><b class="disp">'+(WA.v/1000).toFixed(2).replace(".",",")+'</b> / '+(wTarget/1000).toFixed(1).replace(".",",")+' L</span></div><div class="bar'+(WA.v>=wTarget?" ok":"")+'"><i style="width:'+wpct.toFixed(1)+'%"></i></div>'+
   '<div class="qchips"><button class="qchip" data-water="250">Copo +250 ml</button><button class="qchip" data-water="500">Garrafa +500 ml</button>'+(WA.h.length?'<button class="qchip" data-water="undo">Desfazer</button>':'')+'</div></div></div>';
  const shop='<div class="sec"><div class="card"><details class="fold shop"><summary>Lista de compras da semana</summary>'+SHOP.map(([g,items])=>'<h4>'+g+'</h4>'+items.map(it=>{const k=it.split(" · ")[0];return '<label class="'+(S.shop[k]?"got":"")+'"><input type="checkbox" data-shop="'+k+'"'+(S.shop[k]?" checked":"")+'><span>'+it+'</span></label>'}).join("")).join("")+
   '<button class="btn ghost block" id="shopClear" style="margin-top:12px">Desmarcar tudo</button></details></div></div>';
  const meals=MEALS.map(([nm,o])=>'<div class="meal"><small>'+nm+'</small><div>'+o[(c-1)%o.length]+'</div><div class="note">Ou: '+o.filter((x,i)=>i!==(c-1)%o.length).join(" · ")+'</div></div>').join("");
  return '<div class="stack"><div><div class="greet">Para secar a barriga</div><h1>Dieta</h1></div>'+
  '<div class="card stack" style="gap:12px"><div class="row between"><h3>Meta diária</h3><span class="pill">'+curW().toFixed(1).replace(".",",")+' kg</span></div>'+
  '<div class="macros"><div class="macro"><b>'+T.kcal+'</b><span>kcal por dia</span></div><div class="macro"><b>'+T.prot+' g</b><span>proteína</span></div><div class="macro"><b>'+T.carb+' g</b><span>carboidrato</span></div><div class="macro"><b>'+T.fat+' g</b><span>gordura</span></div></div>'+
  '<div class="row between"><span class="muted">Água</span><b class="disp">'+T.water+' L / dia</b></div>'+
  '<p class="note">Gasto estimado de ~'+T.tdee+' kcal/dia treinando 6 vezes por semana, menos 500 kcal para secar. Recalcula quando seu peso muda.</p></div>'+
  trackers+'<div class="sec"><div class="sechead"><h3>Cardápio de hoje</h3><span>Dia '+c+'</span></div><div class="card" style="padding-block:6px">'+meals+'</div></div>'+
  shop+'<div class="sec"><div class="sechead"><h3>Regras para secar</h3></div><div class="card"><ul class="tips">'+TIPS.map(t=>"<li>"+t+"</li>").join("")+'</ul></div></div>'+
  '<p class="note">Sugestões gerais. Se tiver alguma condição de saúde, procure um nutricionista ou médico antes de mudar a dieta.</p></div>';
}

let PL=null;
function startWorkout(wd){const w=buildWorkout(wd,phaseIdx(dayC()));PL={w,st:buildSteps(w),i:0,run:false,left:0,total:0,last:0,lastSec:null,confirm:false,fin:false};PL.left=PL.st[0].s;
  $("#layer").innerHTML='<div class="player" id="pl"></div>';renderPlayer();tone(1,.01)}
function cur(){return PL.st[PL.i]}
function nextWork(from){for(let j=from;j<PL.st.length;j++)if(PL.st[j].t==="w")return PL.st[j];return null}
function announce(){const s=cur();if(s.t==="w"){const e=EX[s.id];say(e.n+". "+secTxt(s.s)+(s.r?". Meta de "+s.r+" repetições":"")+(e.side?". Troque de lado na metade":""))}
  else{const nx=nextWork(PL.i+1);say("Descanso. "+secTxt(s.s)+(nx?". Próximo: "+EX[nx.id].n:""))}}

  const s=cur(),rest=s.t==="r",nx=nextWork(PL.i+1),showId=rest?(nx?nx.id:"Standing_Lateral_Stretch"):s.id;

  $("#plHead").innerHTML=""+

  '<div class="pl-prog"><i style="width:'+(PL.i/PL.st.length*100).toFixed(1)+'%"></i></div>'+
  (PL.confirm?'<div class="confirm"><b>Sair do treino?</b><span class="note">O progresso desta sessão não será salvo.</span><div class="row"><button class="btn ghost danger" id="cfY" style="flex:1">Sair</button><button class="btn" id="cfN" style="flex:1">Continuar</button></div></div>':'')+
  "";nat("workoutStatus",rest?"Descanso · próximo: "+(nx?EX[nx.id].n:"fim"):EX[s.id].n,(rest?"Descanso":"Exercício "+wi+" de "+wt)+" · "+PL.w.n,!!PL.run,Math.round(Date.now()+PL.left*1000),Math.ceil(PL.left));
  if(PL.media!==showId){$("#plMedia").innerHTML=vidHTML(showId,SPEED[showId]);PL.media=showId}
  $("#plBody").innerHTML='<div class="pl-stage"><span class="pill">'+(s.lab||"")+'</span>'+(rest&&nx?'<span class="muted">a seguir</span>':'')+'<button class="roundbtn" id="plInfo" aria-label="Como fazer" style="margin-left:auto;width:40px;height:40px">'+IC.info+'</button></div>'+
  '<div><h2 class="pl-name">'+(rest?(nx?EX[nx.id].n:"Fim"):EX[s.id].n)+'</h2><div class="pl-rx">'+(rest?(nx?rxLong(nx):""):rxLong(s))+'</div></div>'+
  '<div class="pl-time"><div class="bigtime" id="plTime">'+fmtT(PL.left)+'</div></div>'+
  '<div class="ring"><i id="plBar" style="width:'+((1-PL.left/s.s)*100).toFixed(1)+'%"></i></div>'+
  (!rest&&nx?'<div class="pl-next">Depois: <b>'+EX[nx.id].n+'</b> · '+rxShort(nx)+'</div>':'')+
  '<div class="pl-ctrl"><button class="sq" id="plPrev" aria-label="Etapa anterior"'+(PL.i===0?" disabled":"")+'>'+IC.back+'</button>'+
  '<button class="main" id="plPlay">'+(PL.run?IC.pause+" Pausar":IC.play+" "+(PL.left<s.s?"Continuar":(PL.i===0?"Começar":"Iniciar")))+'</button>'+
  '<button class="sq" id="plReset" aria-label="Reiniciar etapa">'+IC.reset+'</button><button class="sq" id="plSkip" aria-label="Pular etapa">'+IC.skip+'</button></div>';
  $("#plX").onclick=()=>{PL.confirm=true;renderPlayer()};
  if(PL.confirm){$("#cfY").onclick=()=>{PL.run=false;nat("disarmTimer");nat("workoutEnd");keepAwake(false);PL=null;closeLayer()};$("#cfN").onclick=()=>{PL.confirm=false;renderPlayer()}}
  $("#plInfo").onclick=()=>infoOver(showId);
  $("#plPlay").onclick=()=>{const first=PL.left>=cur().s;PL.run=!PL.run;PL.last=performance.now();if(PL.run){keepAwake(true);if(first)announce()}arm();renderPlayer()};
  $("#plPrev").onclick=()=>{if(PL.i>0){PL.i--;loadStep(true)}};
  $("#plReset").onclick=()=>loadStep(true);
  $("#plSkip").onclick=()=>advance(false);
}
function loadStep(speak){PL.left=cur().s;PL.lastSec=null;if(speak&&PL.run)announce();arm();renderPlayer()}
function infoOver(id){const e=EX[id],d=document.createElement("div");d.className="scrim";d.style.zIndex=80;
  d.innerHTML='<div class="sheet"><div class="row between"><h2>'+e.n+'</h2><button class="roundbtn" aria-label="Fechar">'+IC.x+'</button></div><ol>'+e.how.map(h=>"<li>"+h+"</li>").join("")+'</ol><div class="note">'+e.tip+'</div></div>';
  document.body.appendChild(d);const c=()=>d.remove();d.querySelector("button").onclick=c;d.onclick=ev=>{if(ev.target===d)c()}}
function advance(auto){
  if(auto)alarm();
  if(PL.i<PL.st.length-1){PL.i++;PL.left=cur().s;PL.lastSec=null;if(auto)PL.run=true;if(PL.run){PL.last=performance.now();setTimeout(announce,auto&&S.alarm?1200:150)}arm();renderPlayer()}
  else finish();
}
function rateWorkout(k){if(!PL)return;const prev=PL.feel;PL.feel=k;let a=adjF();
  const undo={easy:-.05,hard:.07,ok:0}[prev]||0;a+=undo;a+= k==="easy"?.05:k==="hard"?-.07:0;S.adj=Math.min(1.3,Math.max(.75,Math.round(a*100)/100));
  const h=S.history[S.history.length-1];if(h)h.feel=k;save();renderPlayer()}
function finish(){PL.run=false;PL.fin=true;nat("disarmTimer");nat("workoutEnd");keepAwake(false);setTimeout(()=>say("Treino concluído. Mandou bem!"),1200);
  S.history.push({d:todayStr(),n:PL.w.n,wd:PL.w.wd,dur:Math.round(PL.total),day:dayC()});save();renderPlayer()}
function plTick(){if(!PL||PL.fin||!PL.run)return;const now=performance.now(),dt=(now-PL.last)/1000;PL.last=now;PL.total+=dt;PL.left-=dt;
  const s=cur(),sec=Math.ceil(PL.left);
  if(sec!==PL.lastSec){PL.lastSec=sec;cueCount(sec,s.s);if(s.t==="w"&&EX[s.id].side&&sec===Math.ceil(s.s/2)&&sec>3){beep();say("Troque de lado")}}
  if(PL.left<=0){advance(true);return}
  const t=$("#plTime");if(t)t.textContent=fmtT(PL.left);const b=$("#plBar");if(b)b.style.width=((1-PL.left/s.s)*100).toFixed(1)+"%";const tt=$("#plTot");if(tt)tt.textContent=fmtT(PL.total)}
setInterval(()=>{plTick();itTick()},200);

/* ================= Eventos ================= */
function backupJSON(){return JSON.stringify({app:"shaper",v:1,date:new Date().toISOString(),state:S,photos:PHOTOS})}
function applyBackup(text){let o;try{o=JSON.parse(text)}catch(e){toast("Arquivo de backup inválido");return}
  if(!o||o.app!=="shaper"||!o.state){toast("Este arquivo não é um backup do Shaper");return}
  const box=$("#bkConfirm");const go=()=>{const st=o.state;S=defaults();Object.assign(S,st);S.profile=Object.assign(defaults().profile,st.profile||{});S.reminder=Object.assign(defaults().reminder,st.reminder||{});
    const ph=Array.isArray(o.photos)?o.photos:null;(ph?DB.clear().then(()=>Promise.all(ph.map(p=>DB.put(p)))):Promise.resolve()).catch(()=>{}).then(loadPhotos).then(()=>{S.badgesSeen=badgeList().filter(b=>b[3]).map(b=>b[0]);save();tab="home";phSel=null;render();toast("Backup restaurado")})};
  if(box){box.innerHTML='<div class="confirm"><b>Restaurar este backup?</b><span class="note">De '+(o.date?new Date(o.date).toLocaleDateString("pt-BR"):"data desconhecida")+', com '+((o.state.history||[]).length)+' treinos'+(Array.isArray(o.photos)?' e '+o.photos.length+' fotos':' (as fotos do celular continuam)')+'. Os dados atuais serão substituídos.</span><div class="row"><button class="btn primary" style="flex:1" id="bkY">Restaurar</button><button class="btn" style="flex:1" id="bkN">Cancelar</button></div></div>';$("#bkY").onclick=go;$("#bkN").onclick=()=>{box.innerHTML=""}}else go()}
window.shaperImport=function(text){tab="ajustes";render();applyBackup(text)};
function bind(){
  document.querySelectorAll("[data-pose]").forEach(b=>b.onclick=()=>{poseSel=b.dataset.pose;render()});
  document.querySelectorAll("[data-photo]").forEach(b=>b.onclick=()=>openPhoto(+b.dataset.photo));
  const pf2=$("#phFile");if(pf2)pf2.onchange=()=>{const f=pf2.files&&pf2.files[0];if(!f)return;toast("Salvando foto…");
    shrink(f).then(data=>DB.put({id:Date.now(),d:todayStr(),pose:poseSel,data})).then(loadPhotos).then(()=>{save();render();toast("Foto salva")}).catch(()=>toast("Não foi possível salvar a foto"))};
  const lo=$("#lightOn");if(lo)lo.onchange=()=>{S.light=lo.checked;save();render();toast(S.light?"Versão leve ativada":"Versão normal")};
  document.querySelectorAll("[data-prot]").forEach(b=>b.onclick=()=>{const P=dayCounter("prot");if(b.dataset.prot==="undo"){P.v-=P.h.pop()||0}else{const g=+b.dataset.prot;P.v+=g;P.h.push(g)}save();render()});
  document.querySelectorAll("[data-water]").forEach(b=>b.onclick=()=>{const W=dayCounter("water");if(b.dataset.water==="undo"){W.v-=W.h.pop()||0}else{const g=+b.dataset.water;W.v+=g;W.h.push(g)}save();render()});
  document.querySelectorAll("[data-shop]").forEach(c=>c.onchange=()=>{if(c.checked)S.shop[c.dataset.shop]=1;else delete S.shop[c.dataset.shop];save();c.closest("label").classList.toggle("got",c.checked)});
  const sc=$("#shopClear");if(sc)sc.onclick=()=>{S.shop={};save();render();toast("Lista desmarcada")};
  const be=$("#bkExp");if(be){be.onclick=()=>{nat("exportBackup",backupJSON(),"shaper-backup-"+todayStr()+".json")};$("#bkImp").onclick=()=>nat("importBackup")}
  const bc=$("#bkCopy");if(bc){bc.onclick=()=>{const t=backupJSON();try{navigator.clipboard.writeText(t).then(()=>toast("Backup copiado"),()=>{$("#bkText").value=t;$("#bkText").select();toast("Selecione e copie o texto")})}catch(e){$("#bkText").value=t;toast("Selecione e copie o texto")}};
    $("#bkPaste").onclick=()=>applyBackup($("#bkText").value)}
  document.querySelectorAll("[data-act=start]").forEach(b=>b.onclick=()=>startWorkout(+b.dataset.wd));
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{tab=b.dataset.go;render();scrollTo(0,0)});
  document.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{phSel=+b.dataset.ph;render()});
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{daySel=+b.dataset.day;render()});
  document.querySelectorAll(".ex[data-ex]").forEach(b=>b.onclick=()=>openEx(b.dataset.ex));
  const hs=$("#hStart");if(hs)hs.onchange=()=>{if(/^\d{4}-\d{2}-\d{2}$/.test(hs.value)){S.start=hs.value;phSel=null;save();render();toast("Início do programa: "+fmtD(S.start))}};
  const wf=$("#wform");if(wf)wf.onsubmit=ev=>{ev.preventDefault();const kg=parseFloat(String($("#wkg").value).replace(",","."));const cm=parseFloat(String($("#wcm").value).replace(",","."));
    if(!(kg>30&&kg<250)){toast("Digite um peso entre 30 e 250 kg");return}const t=todayStr();let l=S.logs.find(x=>x.d===t);if(!l){l={d:t};S.logs.push(l)}l.kg=kg;l.waist=(cm>40&&cm<200)?cm:(l.waist||null);
    S.logs.sort((a,b)=>a.d<b.d?-1:1);save();render();toast("Registrado")};
  const ro=$("#remOn");if(ro){ro.onchange=()=>{S.reminder.on=ro.checked;save();if(ro.checked)nat("requestNotificationPermission");toast(ro.checked?"Lembrete ativado":"Lembrete desativado")};
    $("#remTime").onchange=e=>{const v=e.target.value.split(":");if(v.length===2){S.reminder.h=+v[0];S.reminder.m=+v[1];save();toast("Lembrete às "+e.target.value)}};
    $("#voiceOn").onchange=e=>{S.voice=e.target.checked;save()};document.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>{S.demo=b.dataset.demo;save();render();toast(S.demo==="boneco"?"Boneco animado ativado":S.demo==="video"?"Vídeo do YouTube ativado":"Fotos ativadas")});$("#alarmOn").onchange=e=>{S.alarm=e.target.checked;save()};
    $("#testAlarm").onclick=()=>{const a=S.alarm;S.alarm=true;alarm();S.alarm=a};$("#testVoice").onclick=()=>{const v=S.voice;S.voice=true;say("Prancha. 40 segundos. Faltam 10 segundos. 3, 2, 1.");S.voice=v};
    $("#testNotif").onclick=()=>{if(NATIVE){nat("requestNotificationPermission");nat("testNotification");toast("Notificação enviada")}else toast("As notificações funcionam no app Android instalado")}}
  const pf=$("#pform");if(pf)pf.onsubmit=ev=>{ev.preventDefault();const p=S.profile;p.age=+$("#pAge").value||p.age;p.sex=$("#pSex").value;p.height=+$("#pH").value||p.height;p.startWeight=+$("#pW").value||p.startWeight;p.goalWeight=+$("#pG").value||p.goalWeight;save();render();toast("Perfil salvo")};
  const ig=$("#itGo");if(ig){const rd=()=>{IT.work=Math.max(5,+$("#itW").value||40);IT.rest=Math.max(0,+$("#itR").value||0);IT.rounds=Math.max(1,+$("#itN").value||1)};
    ["#itW","#itR","#itN"].forEach(s=>$(s).onchange=()=>{rd();if(!IT.run)itReset();itSync()});
    ig.onclick=()=>{rd();if(IT.phase==="d")itReset();const first=!IT.run&&IT.phase==="w"&&IT.left>=IT.work&&IT.round===1;IT.run=!IT.run;IT.last=performance.now();
      if(IT.run){keepAwake(true);tone(1,.01);if(first)say("Vai! "+secTxt(IT.work));nat("armTimer",Math.round(IT.left*1000),"Tempo esgotado",IT.phase==="w"?"Hora do descanso":"Hora de voltar ao exercício")}else nat("disarmTimer");itSync()};
    $("#itReset").onclick=()=>{rd();itReset();itSync()}}
  const ra=$("#resetAsk");if(ra)ra.onclick=()=>{$("#resetBox").innerHTML='<div class="confirm"><b>Apagar tudo?</b><span class="note">Histórico, pesos, fotos e ajustes serão apagados e o programa recomeça hoje.</span><div class="row"><button class="btn ghost danger" id="rsY" style="flex:1">Apagar</button><button class="btn" id="rsN" style="flex:1">Cancelar</button></div></div>';
    $("#rsY").onclick=()=>{S=defaults();DB.clear().catch(()=>{});PHOTOS=[];save();tab="home";phSel=null;render();toast("Dados apagados")};$("#rsN").onclick=render};
}
$("#tabs").addEventListener("click",ev=>{const b=ev.target.closest("button[data-tab]");if(!b)return;tab=b.dataset.tab;if(tab==="treino")daySel=null;if(tab==="home")phSel=null;render();scrollTo(0,0)});

function syncNative(){if(!NATIVE)return;nat("setReminder",!!S.reminder.on,S.reminder.h|0,S.reminder.m|0);
  nat("updateWidget",JSON.stringify({start:S.start,names:PLAN.map(p=>p.n),streak:streak(),weight:curW(),lastDone:S.history.length?S.history[S.history.length-1].d:"",total:S.history.length}))}
window.shaperCmd=function(c){if(!PL||PL.fin)return;if(c==="toggle"){PL.run=!PL.run;PL.last=performance.now();if(PL.run)keepAwake(true);arm();renderPlayer()}else if(c==="skip")advance(false)};
window.shaperBack=function(){const extra=document.querySelector("body > .scrim");if(extra){extra.remove();return true}
  if(PL&&!PL.fin){PL.confirm=true;renderPlayer();return true}if(PL&&PL.fin){PL=null;closeLayer();render();return true}
  if($("#scrim")){closeLayer();return true}if(tab!=="home"){tab="home";render();return true}return false};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!PL&&tab!=="timer")render()});
try{speechSynthesis.getVoices()}catch(e){}
load();render();loadPhotos().then(()=>{if(tab==="prog")render()});syncNative();if(NATIVE)nat("requestNotificationPermission");
</script>
